<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAHMED | الدرع المالي لشركات السياحة</title>
    <meta name="description" content="خدمات المراجعة الداخلية والتدقيق المالي وتأسيس الهيكل التشغيلي لشركات السياحة المستجلبة (Inbound Tourism) بإشراف المحاسب فهمي أحمد.">
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="FAHMED | الدرع المالي لكل صاحب عمل">
    <meta property="og:description" content="خدمات المراجعة الداخلية وتدقيق العمليات المالية والتشغيلية لشركات السياحة.">
    <meta property="og:type" content="website">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><path d='M30 70 L50 35 L70 70 Z' fill='%2338bdf8'/></svg>">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Variables & Theming */
        :root {
            --primary: #0f172a;
            --primary-light: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --text-heading: #0f172a;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --primary: #f8fafc;
            --primary-light: #e2e8f0;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --bg: #0b0f19;
            --card-bg: #111827;
            --text: #94a3b8;
            --text-heading: #f8fafc;
            --border: #1f2937;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-family: 'Tajawal', sans-serif;
        }

        html[lang="en"] {
            font-family: 'Plus Jakarta Sans', 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.7;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Header & Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid var(--border);
            transition: var(--transition);
        }

        [data-theme="dark"] header {
            background-color: rgba(17, 24, 39, 0.85);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-heading);
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            direction: ltr;
            unicode-bidi: isolate;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 1.75rem;
        }

        .nav-link {
            font-weight: 500;
            color: var(--text);
            transition: var(--transition);
        }

        .nav-link:hover {
            color: var(--accent);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.75rem;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #0f172a;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-outline {
            border: 2px solid var(--border);
            color: var(--text-heading);
            background: transparent;
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .icon-btn, .hamburger {
            background: none;
            border: 1px solid var(--border);
            cursor: pointer;
            color: var(--text-heading);
            font-size: 0.95rem;
            font-weight: 700;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            min-width: 40px;
            padding: 0 0.65rem;
            border-radius: 50px;
            background-color: var(--card-bg);
            transition: var(--transition);
        }

        .icon-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            width: 40px;
            padding: 0;
        }

        .hamburger span {
            display: block;
            width: 20px;
            height: 2px;
            background-color: var(--text-heading);
            transition: var(--transition);
        }

        /* Hero Section */
        .hero {
            padding: 180px 0 100px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 4rem;
            align-items: center;
        }

        .hero-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .hero h1 {
            font-size: 3.1rem;
            font-weight: 900;
            color: var(--text-heading);
            line-height: 1.2;
            margin-bottom: 1.5rem;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
            color: var(--text);
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .hero-graphic {
            position: relative;
            width: 100%;
            height: 380px;
            background: linear-gradient(135deg, #1e293b, var(--card-bg));
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-graphic svg {
            width: 80%;
            height: 80%;
        }

        /* Section Commons */
        section {
            padding: 100px 0;
        }

        .section-header {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 4rem;
        }

        .section-header h2 {
            font-size: 2.4rem;
            font-weight: 900;
            color: var(--text-heading);
            margin-bottom: 1rem;
        }

        .section-header p {
            font-size: 1.1rem;
        }

        /* About & Stats */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .about-content h2 {
            font-size: 2.1rem;
            color: var(--text-heading);
            margin-bottom: 1.5rem;
        }

        .about-content p {
            margin-bottom: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--accent);
            margin-bottom: 0.5rem;
            direction: ltr;
            unicode-bidi: isolate;
        }

        .stat-label {
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* Alt Section Backgrounds */
        .section-alt {
            background-color: rgba(15, 23, 42, 0.03);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        [data-theme="dark"] .section-alt {
            background-color: rgba(30, 41, 59, 0.35);
        }

        /* Services */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .service-card {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .service-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
        }

        .service-icon {
            width: 60px;
            height: 60px;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .service-card h3 {
            font-size: 1.3rem;
            color: var(--text-heading);
            margin-bottom: 1rem;
        }

        /* Why Choose Us */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
        }

        .feature-item {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .feature-item h3 {
            font-size: 1.15rem;
            color: var(--text-heading);
            margin-bottom: 0.75rem;
        }

        /* Portfolio / Works */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .portfolio-item {
            background-color: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .portfolio-item:hover {
            transform: translateY(-5px);
        }

        .portfolio-img {
            height: 200px;
            background: linear-gradient(135deg, #0284c7, #0f172a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
            direction: ltr;
        }

        .portfolio-info {
            padding: 1.5rem;
        }

        .portfolio-info h3 {
            font-size: 1.2rem;
            color: var(--text-heading);
            margin-bottom: 0.5rem;
        }

        /* Testimonials */
        .testimonials-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .testimonial-card {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .testimonial-text {
            font-style: italic;
            margin-bottom: 2rem;
            color: var(--text);
        }

        .testimonial-author h4 {
            color: var(--text-heading);
            font-size: 1.1rem;
        }

        .testimonial-author span {
            font-size: 0.85rem;
            color: var(--accent);
        }

        /* FAQ */
        .faq-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .faq-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 1rem;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .faq-question {
            padding: 1.25rem 1.5rem;
            font-weight: 700;
            color: var(--text-heading);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .faq-question:hover {
            color: var(--accent);
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            padding: 0 1.5rem;
            transition: max-height 0.3s ease, padding 0.3s ease;
            color: var(--text);
        }

        .faq-item.active .faq-answer {
            max-height: 240px;
            padding: 0 1.5rem 1.5rem 1.5rem;
        }

        .faq-item.active .faq-question svg {
            transform: rotate(180deg);
        }

        .faq-question svg {
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        /* Contact Section */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 4rem;
        }

        .contact-info-item {
            display: flex;
            align-items: flex-start;
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .contact-icon {
            width: 50px;
            height: 50px;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .contact-info-item h4 {
            color: var(--text-heading);
            font-size: 1.1rem;
            margin-bottom: 0.2rem;
        }

        .contact-form {
            background-color: var(--card-bg);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--text-heading);
            margin-bottom: 0.5rem;
        }

        .form-control {
            width: 100%;
            padding: 0.85rem 1.2rem;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-heading);
            font-family: inherit;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .form-success-msg {
            display: none;
            background-color: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-weight: 600;
            text-align: center;
        }

        /* Footer */
        footer {
            background-color: #0f172a;
            color: #94a3b8;
            padding: 80px 0 30px;
            border-top: 1px solid var(--border);
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 4rem;
            margin-bottom: 4rem;
        }

        .footer-brand p {
            margin-top: 1rem;
            color: #94a3b8;
        }

        .footer-links h4 {
            color
